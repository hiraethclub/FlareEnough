name: Release

# Build a signed release APK and publish it as a GitHub Release.
# Two ways to start it:
#   1. Push a version tag like v0.1.0 (the normal way, from your own machine).
#   2. Run it by hand from the Actions tab, giving the version, for example 0.1.0.
# Either way the signing key comes from GitHub secrets, decoded on the build machine
# and discarded when the run ends. See RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v, for example 0.1.0"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Work out the release tag
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "target=--target ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run the scheduling logic tests (pure JVM)
        run: ./gradlew :schedule:test --no-daemon --stacktrace

      - name: Run the app unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The KEYSTORE_BASE64 secret is not set." >&2
            echo "Add the signing secrets (see RELEASING.md) before releasing." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK after the tag
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/flare-enough-${{ steps.rel.outputs.tag }}.apk"

      - name: Write the release notes
        run: |
          # Use the store changelog for this version code as the notes, so the
          # Release page, F-Droid, and the in app changelog all say the same thing.
          vcode=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          changelog="fastlane/metadata/android/en-US/changelogs/${vcode}.txt"
          {
            if [ -f "$changelog" ]; then
              cat "$changelog"
              echo
            fi
            echo "### Install"
            echo
            echo "Download the APK below and open it on your phone. Android will ask you to allow installing from this source, which is normal for anything outside the Play Store."
            echo
            echo "The app works fully offline: no internet permission, no ads, no trackers, no accounts."
          } > release-notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.rel.outputs.tag }}"
          apk="dist/flare-enough-${tag}.apk"
          # Idempotent: edit the release if it already exists (for example when re-run
          # to refresh the notes), otherwise create it.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Flare Enough $tag" --notes-file release-notes.md
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" \
              --title "Flare Enough $tag" \
              --notes-file release-notes.md ${{ steps.rel.outputs.target }}
          fi
