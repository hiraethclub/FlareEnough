# Give the Gradle JVM enough memory for the Android build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run independent modules in parallel and cache task outputs. Faster local builds.
org.gradle.parallel=true
org.gradle.caching=true

# Use AndroidX, not the old support library.
android.useAndroidX=true

# Only generate the resources actually used, keeps the app small.
android.nonTransitiveRClass=true

# Kotlin code style.
kotlin.code.style=official
